    }

    input:focus, textarea:focus {
        border-color: #ff9a3d;
        box-shadow: 0 0 6px rgba(255,165,0,0.5);
        outline: none;
    }
    button {
        background: linear-gradient(45deg, #ffb347, #ffcc33);
        border: none;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: linear-gradient(45deg, #ff9a3d, #ffbf00);
        transform: scale(1.05);
    }

    
    .container img {
