<!DOCTYPE html>
<html>
<head>
    <title>Book your Trip</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        
        nav.navbar {
            background-color: #282929;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 6px;
            background-color: #023749;
            transition: 0.3s ease;
        }

        .navbar a:hover {
            background-color: #d0d2d4;
            color: #000;
            transform: scale(1.05);
        }

        
        .hero {
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(
                rgba(0, 0, 0, 0.2), 
                rgba(0, 0, 0, 0.2)
            ),
            url("https://cdn.pixabay.com/photo/2022/11/14/20/14/anchor-7592445_1280.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }

        .hero h1 {
            font-size: 4rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px black;
        }

        .hero p {
            font-size: 1.5rem;
            margin-top: 10px;
            text-shadow: 1px 1px 6px black;
        }
    </style>

</head>

<body>

    
    <nav class="navbar">
        <a href="pack.html" target="_blank"><b>TOUR PACKAGES</b></a>
        <a href="book.html" target="_blank"><b>BOOK YOUR TRIP</b></a>
        <a href="contact.html" target="_blank"><b>CONTACT US</b></a>
    </nav>

    
    <header class="hero">
        <h1>VOYAGE VISTA</h1>
        <p><b>Your Gateway to Breathtaking Destinations</b></p>
    </header>

</body>
</html>
