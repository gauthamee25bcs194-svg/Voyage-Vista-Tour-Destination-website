<!DOCTYPE html>
<html>
<head>
<title>Form</title>

<style>
    body {
        background-image:url("https://img.freepik.com/premium-vector/vector-background-with-tropical-trees-mountains-vector-background-with-tropical-trees-mounta_912214-19619.jpg");
        background-size: cover;
        font-family: Arial, sans-serif;
    }
    nav.navbar {
            background-color: #282929;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .navbar a {
            text-decoration: none;
            color: rgb(24, 1, 1);
            padding: 10px 20px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 6px;
            background-color: #c7d69b;
            transition: 0.3s ease;
        }

        .navbar a:hover {
            background-color: #d0d2d4;
            color: #000;
            transform: scale(1.05);
        }

    form {
        width: 700px;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(5px);
        margin: 30px auto;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
    }

    
    .row {
        display: grid;
        grid-template-columns: 200px 1fr;
        align-items: center;
        margin-bottom: 18px;
        column-gap: 15px;
    }

    label {
        font-weight: bold;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #aaa;
        font-size: 15px;
    }

    textarea {
        height: 90px;
        resize: none;
    }

    .trans-group {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    input[type="submit"] {
        background: #f0a53a;
        padding: 12px 25px;
        border: none;
        cursor: pointer;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
    }

    .submit-row {
        text-align: center;
        margin-top: 25px;
    }
    h1{font-family: Georgia, serif;
    font-size: 2.3em;
    color: #d4d4ac;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    margin-top: 20px;}
</style>
</head>

<body>
<nav class="navbar">
    
        <a href="itproject-index-open first.html" target="_blank"><b>HOME</b></a>
        <a href="pack.html" target="_blank"><b>TOUR PACKAGES</b></a>
        <a href="contact.html" target="_blank"><b>CONTACT US</b></a>
    </nav>
<center><H1>BOOK YOUR DREAM TOUR . . .</H1></center>
 
<form action="submit" method="post">

    <div class="row">
        <label>First Name</label>
        <input type="text" placeholder="First Name">
    </div>

    <div class="row">
        <label>Last Name</label>
        <input type="text" placeholder="Last Name">
    </div>

    <div class="row">
        <label>E-Mail</label>
        <input type="email" placeholder="E-Mail Address">
    </div>

    <div class="row">
        <label>Phone #</label>
        <input type="tel" placeholder="(845)555-1212">
    </div>

    <div class="row">
        <label>Address</label>
        <input type="text" placeholder="Address">
    </div>

    <div class="row">
        <label>City</label>
        <input type="text" placeholder="City">
    </div>

    <div class="row">
        <label>Select your destination</label>
        <select>
            <option>Please select your destination</option>
            <option>Goa</option>
            <option>Agra</option>
            <option>Manali</option>
            <option>Mysore</option>
            <option>Kerala Backwaters</option>
            <option>Darjeeling</option>
        </select>
    </div>

    <div class="row">
        <label>Travel date</label>
        <input type="date" placeholder="Travel Date">
    </div>

    <div class="row">
        <label>Number of Travellers</label>
        <input type="text" placeholder="Number of Travellers">
    </div>
    
    <div class="row">
        <label>Select your package</label>
        <select>
            <option>Please select your tour package</option>
            <option>Family</option>
            <option>Couple</option>
            <option>Solo</option>
            <option>Adventure</option>
             </select>
    </div>
    
    <div class="row">
        <label>Select your meal preference</label>
        <select>
            <option>Please select your meal preference</option>
            <option>Veg</option>
            <option>Non-Veg</option>
            <option>Vegan</option>
            <option>Gluten-free</option>
             </select>
    </div>

    <div class="row">
        <label>Do you need transportation?</label>
        <div class="trans-group">
            <label><input type="radio" name="host"> Yes</label>
            <label><input type="radio" name="host"> No</label>
        </div>
    </div>

    <div class="row">
        <label>Any special requirements</label>
        <textarea placeholder="Special Requirements"></textarea>
    </div>

    <div class="submit-row">
        <input type="submit" value="Send">
    </div>

</form>

</body>
</html>
